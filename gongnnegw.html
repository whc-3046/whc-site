<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城平台</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="home-page" id="homeContainer">
        <div class="home-header">
            <div>
                <h1>商城平台</h1>
                <p>欢迎来到我们的购物平台，以下是今日热卖商品。</p>
                <p class="welcome-text">欢迎您，<span id="userGreeting"></span>！</p>
            </div>
            <button id="logoutBtn" class="logout-btn">退出登录</button>
        </div>

        <div class="product-grid">
            <div class="product-card">
                <h3>智能耳机</h3>
                <p>降噪、无线连接，随时随地享受高品质音乐体验。</p>
                <div class="price">¥299</div>
            </div>

            <div class="product-card">
                <h3>运动手环</h3>
                <p>全天健康监测，支持心率、睡眠和多种运动模式。</p>
                <div class="price">¥169</div>
            </div>

            <div class="product-card">
                <h3>时尚背包</h3>
                <p>轻量防水设计，适合日常出行与商务通勤。</p>
                <div class="price">¥229</div>
            </div>

            <div class="product-card">
                <h3>护肤套装</h3>
                <p>多效保湿修护，让肌肤焕发自然光彩。</p>
                <div class="price">¥199</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
